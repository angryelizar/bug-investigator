[project]
name = "bug-investigator"
version = "0.1.0"
description = "Агент: от Bug Report до проверенного Fix и Fix PR"
authors = [
    { name = "elizarcarsleep", email = "elizar.konovalov@carsleep.io" }
]
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.12.0",
    "fff-search>=0.11.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bug-investigator = "bug_investigator.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:`langchain-community` is being sunset:DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
